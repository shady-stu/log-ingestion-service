name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  contract-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run contract smoke test with authentication disabled
        shell: bash
        run: |
          set -euo pipefail
          project=logs-ci-auth-disabled
          docker compose -p "$project" down -v --remove-orphans || true
          trap 'docker compose -p "$project" down -v --remove-orphans' EXIT
          AUTH_ENABLED=false docker compose -p "$project" up -d --build
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          AUTH_ENABLED=false CONTRACT_BASE_URL=http://localhost:8080 npm run test:contract

      - name: Run contract smoke test with authentication enabled
        shell: bash
        run: |
          set -euo pipefail
          project=logs-ci-auth-enabled
          token=ci-loadgen-api-key
          docker compose -p "$project" down -v --remove-orphans || true
          trap 'docker compose -p "$project" down -v --remove-orphans' EXIT
          AUTH_ENABLED=true LOADGEN_API_KEY="$token" docker compose -p "$project" up -d --build
          for attempt in {1..30}; do
            if curl --fail --silent -H "Authorization: Bearer $token" http://localhost:8080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          AUTH_ENABLED=true LOADGEN_API_KEY="$token" CONTRACT_API_KEY="$token" CONTRACT_BASE_URL=http://localhost:8080 npm run test:contract
